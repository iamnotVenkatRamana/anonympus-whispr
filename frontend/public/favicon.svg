<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The Anonymous Whispers mark. Same geometry as
    src/components/landing/Logo.tsx. Edit both together.

    A standalone file cannot use currentColor: nothing renders a favicon in an
    inheriting context. So the colour is stated here, and flipped by the
    viewer's theme rather than the page's, which is why it is a media query
    and not two files.
  -->
  <style>
    path { fill: #0a0a0b; }
    @media (prefers-color-scheme: dark) { path { fill: #f5f6f7; } }
  </style>
