name: CI

on:
  push:
    branches: [main, level-4-restructure]
  pull_request:
    branches: [main, level-4-restructure]

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install workspace dependencies
        run: npm ci
      - name: Type-check SDK
        run: npx tsc --noEmit --project sdk/tsconfig.json
      - name: Run SDK tests
        run: npm run --workspace=sdk test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install workspace dependencies
        run: npm ci
      - name: Type-check frontend
        run: npx tsc --noEmit --project frontend/tsconfig.json
      - name: Build frontend
        # build:web (not build) runs the real vite build, via the
        # prebuild:web hook that syncs the compiled contract's ZK artifacts
        # into frontend/public/zk first; vite build fails without it.
        run: npm run --workspace=frontend build:web

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install workspace dependencies
        run: npm ci
      - name: Install Compact developer tools
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"
      - name: Install Compact compiler toolchain
        run: compact update
      - name: Compile contract
        run: npm run --workspace=contract compile
      - name: Run contract tests
        run: npm run --workspace=contract test
