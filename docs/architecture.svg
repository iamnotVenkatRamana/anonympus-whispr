<svg width="100%" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Anonymous Whispers architecture</title>
<desc>Progressive left-to-right data flow from organization setup, through reporter's browser encryption, into the Midnight ledger, and back out to the organization's inbox. Warm amber marks on-chain writes with ZK proofs, sage green marks off-chain reads.</desc>

<defs>
  <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#b8834a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowSage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#6b8e6f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="340" y="28" text-anchor="middle" fill="#7d7d7d" style="font-family:sans-serif;font-size:14px;font-weight:500">Anonymous Whispers · data flow</text>

<g transform="translate(40, 44)">
  <rect x="0" y="0" width="14" height="10" fill="#e8c396" stroke="#8a5a2b" stroke-width="0.5"/>
  <text x="20" y="9" fill="#7d7d7d" style="font-family:sans-serif;font-size:12px">on-chain write · needs ZK proof</text>
  <rect x="260" y="0" width="14" height="10" fill="#c9dcc4" stroke="#3f5f43" stroke-width="0.5"/>
  <text x="280" y="9" fill="#7d7d7d" style="font-family:sans-serif;font-size:12px">off-chain read · public indexer</text>
</g>

<g transform="translate(40, 80)">
  <rect x="6" y="6" width="150" height="90" rx="6" fill="#d0d0c9" opacity="0.6"/>
  <rect x="0" y="0" width="150" height="90" rx="6" fill="#f5f0e6" stroke="#8a8580" stroke-width="0.5"/>
  <circle cx="18" cy="18" r="11" fill="#e8c396" stroke="#8a5a2b" stroke-width="0.5"/>
  <text x="18" y="22" text-anchor="middle" fill="#1a1a1a" style="font-family:sans-serif;font-size:12px;font-weight:500">1</text>
  <text x="80" y="22" text-anchor="middle" fill="#1a1a1a" style="font-family:sans-serif;font-size:14px;font-weight:500">Org setup</text>
  <text x="75" y="50" text-anchor="middle" fill="#3d2510" style="font-family:sans-serif;font-size:12px">generate curve25519</text>
  <text x="75" y="65" text-anchor="middle" fill="#3d2510" style="font-family:sans-serif;font-size:12px">keypair in browser</text>
  <text x="75" y="80" text-anchor="middle" fill="#3d2510" style="font-family:sans-serif;font-size:12px">secret stays local</text>
</g>

<line x1="196" y1="130" x2="240" y2="130" stroke="#b8834a" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

<g transform="translate(240, 80)">
  <rect x="6" y="6" width="180" height="90" rx="6" fill="#c9a878" opacity="0.5"/>
  <rect x="0" y="0" width="180" height="90" rx="6" fill="#e8c396" stroke="#8a5a2b" stroke-width="0.5"/>
  <circle cx="18" cy="18" r="11" fill="#f5f0e6" stroke="#8a5a2b" stroke-width="0.5"/>
  <text x="18" y="22" text-anchor="middle" fill="#3d2510" style="font-family:sans-serif;font-size:12px;font-weight:500">2</text>
  <text x="95" y="22" text-anchor="middle" fill="#3d2510" style="font-family:sans-serif;font-size:14px;font-weight:500">Register on chain</text>
  <text x="90" y="50" text-anchor="middle" fill="#3d2510" style="font-family:sans-serif;font-size:12px">register_recipient()</text>
  <text x="90" y="65" text-anchor="middle" fill="#3d2510" style="font-family:sans-serif;font-size:12px">publishes public key</text>
  <text x="90" y="80" text-anchor="middle" fill="#3d2510" style="font-family:sans-serif;font-size:12px">ZK proof accompanies tx</text>
</g>

<line x1="460" y1="130" x2="500" y2="130" stroke="#6b8e6f" stroke-width="1.5" marker-end="url(#arrowSage)"/>

<g transform="translate(500, 80)">
  <rect x="6" y="6" width="140" height="90" rx="6" fill="#a8bfa4" opacity="0.5"/>
  <rect x="0" y="0" width="140" height="90" rx="6" fill="#c9dcc4" stroke="#3f5f43" stroke-width="0.5"/>
  <circle cx="18" cy="18" r="11" fill="#f5f0e6" stroke="#3f5f43" stroke-width="0.5"/>
  <text x="18" y="22" text-anchor="middle" fill="#1e3520" style="font-family:sans-serif;font-size:12px;font-weight:500">3</text>
  <text x="75" y="22" text-anchor="middle" fill="#1e3520" style="font-family:sans-serif;font-size:14px;font-weight:500">Reporter fetches</text>
  <text x="70" y="50" text-anchor="middle" fill="#1e3520" style="font-family:sans-serif;font-size:12px">reads org key</text>
  <text x="70" y="65" text-anchor="middle" fill="#1e3520" style="font-family:sans-serif;font-size:12px">from indexer</text>
  <text x="70" y="80" text-anchor="middle" fill="#1e3520" style="font-family:sans-serif;font-size:12px">no wallet needed</text>
</g>

<rect x="30" y="215" width="620" height="60" rx="6" fill="#eeeae0" stroke="#8a8580" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="340" y="235" text-anchor="middle" fill="#1a1a1a" style="font-family:sans-serif;font-size:14px;font-weight:500">Midnight ledger · Preprod</text>
<text x="340" y="253" text-anchor="middle" fill="#2a2a2a" style="font-family:sans-serif;font-size:12px">recipient_public_key · recipient_key_version · ciphertexts: List of Bytes 512 (newest first)</text>
<text x="340" y="268" text-anchor="middle" fill="#2a2a2a" style="font-family:sans-serif;font-size:12px">what's public: envelope exists, its size, its timestamp, the org's key. contents: unreadable.</text>

<g transform="translate(40, 310)">
  <rect x="6" y="6" width="180" height="110" rx="6" fill="#c9a878" opacity="0.5"/>
  <rect x="0" y="0" width="180" height="110" rx="6" fill="#e8c396" stroke="#8a5a2b" stroke-width="0.5"/>
  <circle cx="18" cy="18" r="11" fill="#f5f0e6" stroke="#8a5a2b" stroke-width="0.5"/>
  <text x="18" y="22" text-anchor="middle" fill="#3d2510" style="font-family:sans-serif;font-size:12px;font-weight:500">4</text>
  <text x="98" y="22" text-anchor="middle" fill="#3d2510" style="font-family:sans-serif;font-size:14px;font-weight:500">Encrypt in browser</text>
  <text x="90" y="52" text-anchor="middle" fill="#3d2510" style="font-family:sans-serif;font-size:12px">fresh ephemeral keypair</text>
  <text x="90" y="67" text-anchor="middle" fill="#3d2510" style="font-family:sans-serif;font-size:12px">tweetnacl sealed box</text>
  <text x="90" y="82" text-anchor="middle" fill="#3d2510" style="font-family:sans-serif;font-size:12px">fixed 512 B envelope</text>
  <text x="90" y="100" text-anchor="middle" fill="#3d2510" style="font-family:sans-serif;font-size:12px">sender key discarded</text>
</g>

<line x1="226" y1="365" x2="260" y2="365" stroke="#b8834a" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

<g transform="translate(260, 310)">
  <rect x="6" y="6" width="180" height="110" rx="6" fill="#c9a878" opacity="0.5"/>
  <rect x="0" y="0" width="180" height="110" rx="6" fill="#e8c396" stroke="#8a5a2b" stroke-width="0.5"/>
  <circle cx="18" cy="18" r="11" fill="#f5f0e6" stroke="#8a5a2b" stroke-width="0.5"/>
  <text x="18" y="22" text-anchor="middle" fill="#3d2510" style="font-family:sans-serif;font-size:12px;font-weight:500">5</text>
  <text x="105" y="22" text-anchor="middle" fill="#3d2510" style="font-family:sans-serif;font-size:14px;font-weight:500">Submit to chain</text>
  <text x="90" y="52" text-anchor="middle" fill="#3d2510" style="font-family:sans-serif;font-size:12px">submit_encrypted_report()</text>
  <text x="90" y="67" text-anchor="middle" fill="#3d2510" style="font-family:sans-serif;font-size:12px">ZK proof of well-formed</text>
  <text x="90" y="82" text-anchor="middle" fill="#3d2510" style="font-family:sans-serif;font-size:12px">envelope, correct recipient</text>
  <text x="90" y="100" text-anchor="middle" fill="#3d2510" style="font-family:sans-serif;font-size:12px">nothing about sender</text>
</g>

<line x1="446" y1="365" x2="480" y2="365" stroke="#6b8e6f" stroke-width="1.5" marker-end="url(#arrowSage)"/>

<g transform="translate(480, 310)">
  <rect x="6" y="6" width="160" height="110" rx="6" fill="#a8bfa4" opacity="0.5"/>
  <rect x="0" y="0" width="160" height="110" rx="6" fill="#c9dcc4" stroke="#3f5f43" stroke-width="0.5"/>
  <circle cx="18" cy="18" r="11" fill="#f5f0e6" stroke="#3f5f43" stroke-width="0.5"/>
  <text x="18" y="22" text-anchor="middle" fill="#1e3520" style="font-family:sans-serif;font-size:12px;font-weight:500">6</text>
  <text x="85" y="22" text-anchor="middle" fill="#1e3520" style="font-family:sans-serif;font-size:14px;font-weight:500">Org reads &amp; decrypts</text>
  <text x="80" y="52" text-anchor="middle" fill="#1e3520" style="font-family:sans-serif;font-size:12px">reads envelopes</text>
  <text x="80" y="67" text-anchor="middle" fill="#1e3520" style="font-family:sans-serif;font-size:12px">from indexer</text>
  <text x="80" y="82" text-anchor="middle" fill="#1e3520" style="font-family:sans-serif;font-size:12px">decrypts locally with</text>
  <text x="80" y="100" text-anchor="middle" fill="#1e3520" style="font-family:sans-serif;font-size:12px">secret key</text>
</g>

<line x1="330" y1="200" x2="330" y2="215" stroke="#b8834a" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
<line x1="350" y1="310" x2="350" y2="275" stroke="#b8834a" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
<line x1="570" y1="200" x2="570" y2="215" stroke="#6b8e6f" stroke-width="1.5" marker-end="url(#arrowSage)"/>
<line x1="560" y1="310" x2="560" y2="275" stroke="#6b8e6f" stroke-width="1.5" marker-end="url(#arrowSage)"/>

<text x="340" y="470" text-anchor="middle" fill="#7d7d7d" style="font-family:sans-serif;font-size:14px;font-weight:500">Trust boundaries</text>
<text x="340" y="492" text-anchor="middle" fill="#7d7d7d" style="font-family:sans-serif;font-size:12px">Reporter's browser holds plaintext only briefly · sender identity never persists · not on chain</text>
<text x="340" y="510" text-anchor="middle" fill="#7d7d7d" style="font-family:sans-serif;font-size:12px">Organization's browser holds the recipient secret key · never transmitted · not on chain</text>
<text x="340" y="528" text-anchor="middle" fill="#7d7d7d" style="font-family:sans-serif;font-size:12px">Midnight ledger holds only sealed envelopes, keys, and proofs · nothing readable</text>
</svg>
